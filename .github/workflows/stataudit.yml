# stataudit, part 1 of 2: check the pull request (UNPRIVILEGED).
#
# Dogfooding caller for the stataudit repository itself: it calls the local
# reusable workflow and installs stataudit from the pull request's own head
# commit, so every PR is checked by the version of stataudit it contains.
# Other repositories should run `stataudit init` or copy
# examples/workflows/stataudit.yml, which pin a release instead.
#
# Because the tool comes from the PR, a PR can change how its own card is
# produced. That is acceptable only because this job is unprivileged
# (read-only token, no secrets); the privileged comment workflow installs
# stataudit from the default branch and warns on the card when a PR touches
# workflows or the stataudit config.
name: stataudit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: stataudit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      stataudit-repository: ${{ github.repository }}
      stataudit-ref: ${{ github.event.pull_request.head.sha }}
      install-command: ""
      fail-on: never

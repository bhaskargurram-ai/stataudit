# stataudit agent: verified fixes (EXPERIMENTAL, opt-in).
#
# Dogfooding caller for the stataudit repository itself. Other repositories
# should run `stataudit init --agent` or copy examples/workflows/stataudit-agent.yml.
#
# Runs from the default branch (`workflow_run`), with stataudit installed
# from the default branch commit. It does nothing unless the repository has
# the STATAUDIT_LLM_API_KEY secret and the STATAUDIT_LLM_MODEL variable,
# [agent] enabled = true in stataudit.toml, and by default only for PRs by
# owners/members/collaborators or labelled `stataudit:agent`. See agent.yml
# for the three-job trust split.
name: stataudit agent

on:
  workflow_run:
    workflows: ["stataudit"]
    types: [completed]

permissions: {}

jobs:
  agent:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/agent.yml
    with:
      stataudit-repository: ${{ github.repository }}
      stataudit-ref: ${{ github.sha }}
      llm-provider: ${{ vars.STATAUDIT_LLM_PROVIDER }}
      llm-model: ${{ vars.STATAUDIT_LLM_MODEL }}
      llm-base-url: ${{ vars.STATAUDIT_LLM_BASE_URL }}
      llm-reasoning-effort: ${{ vars.STATAUDIT_LLM_REASONING_EFFORT }}
      install-command: ""
      run-for: trusted
    secrets:
      llm-api-key: ${{ secrets.STATAUDIT_LLM_API_KEY }}

  comment:
    needs: agent
    if: needs.agent.outputs.verified == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/comment.yml
    with:
      stataudit-repository: ${{ github.repository }}
      stataudit-ref: ${{ github.sha }}
      pr-number: ${{ needs.agent.outputs.pr-number }}
      artifact-run-id: ${{ github.run_id }}
      labels: true

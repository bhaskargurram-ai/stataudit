# stataudit, part 2 of 2: post the card (PRIVILEGED, never runs PR code).
#
# Dogfooding caller for the stataudit repository itself. Other repositories
# should run `stataudit init` or copy examples/workflows/stataudit-comment.yml.
#
# `workflow_run` workflows always run from the DEFAULT BRANCH, so both the
# reusable workflow (`./.github/workflows/comment.yml`) and the stataudit
# installed by it (`github.sha`, the default branch commit) are trusted code,
# never the pull request's. See docs/SECURITY_MODEL.md.
name: stataudit comment

on:
  workflow_run:
    workflows: ["stataudit"]   # must match the `name:` of stataudit.yml
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/comment.yml
    with:
      stataudit-repository: ${{ github.repository }}
      stataudit-ref: ${{ github.sha }}
      labels: true

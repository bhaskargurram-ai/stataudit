site_name: stataudit
site_description: Check whether statistical conclusions hold up on their own data
site_url: https://bhaskargurram-ai.github.io/stataudit/docs/
repo_url: https://github.com/bhaskargurram-ai/stataudit
repo_name: bhaskargurram-ai/stataudit
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  site/
  requirements.txt
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
nav:
  - Home: index.md
  - Quick start: guide/quickstart.md
  - Auditors and verdicts: guide/auditors.md
  - Reported numbers (check-report): guide/check-report.md
  - Lint and leakage rules: guide/lint.md
  - Configuration and CLI: guide/configuration.md
  - Full reference: REFERENCE.md
  - GitHub integration: guide/github.md
  - MCP server and web UI: guide/mcp.md
  - Agent (experimental): guide/agent.md
  - Agent in detail: AGENT.md
  - Security model: SECURITY_MODEL.md
  - Comparison and FAQ: guide/compare.md
  - Limitations and roadmap: guide/limitations.md
  - Testing stataudit: TESTING.md
  - Python API: guide/api.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
  <title id="t">How stataudit works</title>
  <desc id="d">stataudit run executes a script or notebook in a subprocess and traces every scipy.stats and statsmodels OLS call with its data, options, p-value and line. Each call is audited for normality, outliers, unequal variances, leverage, sparse expected counts and the number of p-values. Only when a check fails are alternatives computed on the same data: Welch, Yuen, Mann-Whitney, Spearman, HC3, refits without influential points, Fisher or Monte Carlo chi-square, and Holm. Fixed rules then give a verdict: holds, fragile or does not hold. Separately, stataudit lint and stataudit check-report run without executing anything. All results go to terminal, HTML, Markdown, JSON and PR comment reports.</desc>
  <style>
    svg { --bg:#ffffff; --edge:#d5dae1; --ink:#1b1f24; --muted:#5b6470; --box:#f5f7f9; --arrow:#8a93a0;
          --accent:#3557c4; --accent-bg:#e9eefc; --ok:#1a7f37; --ok-bg:#e3f4e8; --warn:#9a6700; --warn-bg:#fff3d1;
          --bad:#c62828; --bad-bg:#fde9e7; --grey-bg:#eceff3; --dot:#4b5563; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#12161c; --edge:#343c47; --ink:#e9edf1; --muted:#9aa4ae; --box:#1a2029; --arrow:#6f7884;
            --accent:#8fa8ff; --accent-bg:#1d2648; --ok:#57c27a; --ok-bg:#15301f; --warn:#e0b04a; --warn-bg:#362b12;
            --bad:#ff7b72; --bad-bg:#3a1a1a; --grey-bg:#242b35; --dot:#aeb6c0; }
    }
    text { font-family:-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill:var(--ink); }
    .mono { font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill:var(--bg); stroke:var(--edge); }
    .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
    .inner { fill:var(--bg); stroke:var(--edge); }
    .h { font-size:15px; font-weight:650; }
    .h2 { font-size:13.5px; font-weight:600; }
    .sub { font-size:12.5px; fill:var(--muted); }
    .small { font-size:11.5px; fill:var(--muted); }
    .wire { fill:none; stroke:var(--arrow); stroke-width:1.6; }
    .head { fill:var(--arrow); }
    .pill { fill:var(--bg); stroke:var(--edge); }
    .num { fill:var(--accent); font-size:12px; font-weight:700; }
    .numc { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.2; }
    .c-ok { fill:var(--ok-bg); } .t-ok { fill:var(--ok); }
    .c-warn { fill:var(--warn-bg); } .t-warn { fill:var(--warn); }
    .c-bad { fill:var(--bad-bg); } .t-bad { fill:var(--bad); }
    .c-acc { fill:var(--accent-bg); } .t-acc { fill:var(--accent); }
    .c-grey { fill:var(--grey-bg); } .t-grey { fill:var(--muted); }
    .chip { font-size:12px; font-weight:650; }

    .subt { font-size:11.5px; fill:var(--accent); font-weight:600; }
    .lane { fill:none; stroke:var(--edge); stroke-width:1.3; stroke-dasharray:5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="439" rx="14"/>

  <rect class="box" x="20" y="52" width="150" height="206" rx="10"/>
  <text class="h" x="34" y="79">Your analysis</text>
  <rect class="inner" x="32" y="94" width="126" height="48" rx="7"/>
  <text class="h2 mono" x="44" y="114" font-size="12.5">analysis.py</text>
  <text class="small" x="44" y="131">a script</text>
  <rect class="inner" x="32" y="152" width="126" height="48" rx="7"/>
  <text class="h2 mono" x="44" y="172" font-size="12.5">report.ipynb</text>
  <text class="small" x="44" y="189">or a notebook</text>
  <text class="small" x="34" y="228">its own data,</text>
  <text class="small" x="34" y="244">its own arguments</text>
  <rect class="box" x="204" y="52" width="172" height="206" rx="10"/>
  <circle class="numc" cx="228" cy="74" r="11"/><text class="num" x="228" y="78.2" text-anchor="middle">1</text>
  <text class="h" x="246" y="79">Trace</text>
  <text class="subt" x="220" y="104">every test call</text>
  <text class="sub" x="220" y="130">Runs it in a subprocess</text>
  <text class="sub" x="220" y="149">with a timeout and</text>
  <text class="sub" x="220" y="168">records each scipy.stats</text>
  <text class="sub" x="220" y="187">and statsmodels OLS</text>
  <text class="sub" x="220" y="206">call: the data, options,</text>
  <text class="sub" x="220" y="225">p-value and line.</text>
  <rect class="box" x="402" y="52" width="172" height="206" rx="10"/>
  <circle class="numc" cx="426" cy="74" r="11"/><text class="num" x="426" y="78.2" text-anchor="middle">2</text>
  <text class="h" x="444" y="79">Audit</text>
  <text class="subt" x="418" y="104">on the data it received</text>
  <text class="sub" x="418" y="130">normality, skew</text>
  <text class="sub" x="418" y="149">outliers (MAD, IQR)</text>
  <text class="sub" x="418" y="168">unequal variances</text>
  <text class="sub" x="418" y="187">leverage, Cook's D</text>
  <text class="sub" x="418" y="206">expected counts &lt; 5</text>
  <text class="sub" x="418" y="225">number of p-values</text>
  <rect class="box" x="600" y="52" width="172" height="206" rx="10"/>
  <circle class="numc" cx="624" cy="74" r="11"/><text class="num" x="624" y="78.2" text-anchor="middle">3</text>
  <text class="h" x="642" y="79">Alternatives</text>
  <text class="subt" x="616" y="104">only when a check fails</text>
  <text class="sub" x="616" y="130">Welch's t, Yuen's t</text>
  <text class="sub" x="616" y="149">Mann-Whitney U</text>
  <text class="sub" x="616" y="168">Spearman, HC3 SEs</text>
  <text class="sub" x="616" y="187">refit without</text>
  <text class="sub" x="616" y="206">influential points</text>
  <text class="sub" x="616" y="225">Fisher, Monte Carlo χ²</text>
  <text class="sub" x="616" y="244">Holm-Bonferroni</text>
  <path class="wire" d="M170 155.0 L202 155.0" marker-end="url(#arr)"/>
  <path class="wire" d="M376 155.0 L400 155.0" marker-end="url(#arr)"/>
  <path class="wire" d="M574 155.0 L598 155.0" marker-end="url(#arr)"/>
  <path class="wire" d="M772 155.0 L796 155.0" marker-end="url(#arr)"/>
  <rect class="box" x="802" y="52" width="178" height="206" rx="10"/>
  <circle class="numc" cx="826" cy="74" r="11"/><text class="num" x="826" y="78.2" text-anchor="middle">4</text>
  <text class="h" x="844" y="79">Verdict</text>
  <rect class="c-ok" x="818" y="118" width="146" height="24" rx="12.0"/><text class="chip t-ok" x="891.0" y="134.3" text-anchor="middle">holds</text>
  <rect class="c-warn" x="818" y="148" width="146" height="24" rx="12.0"/><text class="chip t-warn" x="891.0" y="164.3" text-anchor="middle">fragile</text>
  <rect class="c-bad" x="818" y="178" width="146" height="24" rx="12.0"/><text class="chip t-bad" x="891.0" y="194.3" text-anchor="middle">does not hold</text>
  <text class="subt" x="818" y="104">fixed rules</text>
  <text class="small" x="818" y="224">Do the alternatives agree</text>
  <text class="small" x="818" y="240">with the p-value? No LLM.</text>
  <rect class="lane" x="20" y="316" width="752" height="104" rx="10"/>
  <text class="h2" x="36" y="340">Nothing is executed</text>
  <rect class="inner" x="36" y="352" width="350" height="54" rx="7"/>
  <text class="h2 mono" x="50" y="373" font-size="12.5">stataudit lint</text>
  <text class="small" x="50" y="392">reads .py / .ipynb as a syntax tree; flags risky patterns</text>
  <rect class="inner" x="404" y="352" width="352" height="54" rx="7"/>
  <text class="h2 mono" x="418" y="373" font-size="12.5">stataudit check-report</text>
  <text class="small" x="418" y="392">recomputes p from "t(28) = 2.20, p = .04" in your text</text>
  <rect class="box" x="802" y="316" width="178" height="104" rx="10"/>
  <text class="h" x="818" y="342">Reports</text>
  <text class="sub" x="818" y="366">terminal, HTML,</text>
  <text class="sub" x="818" y="384">Markdown, JSON,</text>
  <text class="sub" x="818" y="402">PR comment card</text>
  <path class="wire" d="M891 258 L891 314" marker-end="url(#arr)"/>
  <path class="wire" d="M772 368.0 L800 368.0" marker-end="url(#arr)"/>
  <text class="small" x="34" y="42">stataudit run</text>
</svg>

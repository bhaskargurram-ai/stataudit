<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="t d">
  <title id="t">stataudit: Does the conclusion survive?</title>
  <desc id="d">The stataudit mark, a magnifying lens over a bell curve with its shaded tail and a dashed significance line, next to the wordmark and the tagline 'Does the conclusion survive?'. A small plot shows one data set analysed four ways: Student's t-test lands below alpha = 0.05, while Welch's t, Mann-Whitney and Yuen's trimmed t-test all land above it, so the conclusion does not hold.</desc>
  <style>
    svg { --bg:#ffffff; --edge:#d5dae1; --ink:#1b1f24; --muted:#5b6470; --box:#f5f7f9; --arrow:#8a93a0;
          --accent:#3557c4; --accent-bg:#e9eefc; --ok:#1a7f37; --ok-bg:#e3f4e8; --warn:#9a6700; --warn-bg:#fff3d1;
          --bad:#c62828; --bad-bg:#fde9e7; --grey-bg:#eceff3; --dot:#4b5563; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#12161c; --edge:#343c47; --ink:#e9edf1; --muted:#9aa4ae; --box:#1a2029; --arrow:#6f7884;
            --accent:#8fa8ff; --accent-bg:#1d2648; --ok:#57c27a; --ok-bg:#15301f; --warn:#e0b04a; --warn-bg:#362b12;
            --bad:#ff7b72; --bad-bg:#3a1a1a; --grey-bg:#242b35; --dot:#aeb6c0; }
    }
    text { font-family:-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill:var(--ink); }
    .mono { font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill:var(--bg); stroke:var(--edge); }
    .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
    .inner { fill:var(--bg); stroke:var(--edge); }
    .h { font-size:15px; font-weight:650; }
    .h2 { font-size:13.5px; font-weight:600; }
    .sub { font-size:12.5px; fill:var(--muted); }
    .small { font-size:11.5px; fill:var(--muted); }
    .wire { fill:none; stroke:var(--arrow); stroke-width:1.6; }
    .head { fill:var(--arrow); }
    .pill { fill:var(--bg); stroke:var(--edge); }
    .num { fill:var(--accent); font-size:12px; font-weight:700; }
    .numc { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.2; }
    .c-ok { fill:var(--ok-bg); } .t-ok { fill:var(--ok); }
    .c-warn { fill:var(--warn-bg); } .t-warn { fill:var(--warn); }
    .c-bad { fill:var(--bad-bg); } .t-bad { fill:var(--bad); }
    .c-acc { fill:var(--accent-bg); } .t-acc { fill:var(--accent); }
    .c-grey { fill:var(--grey-bg); } .t-grey { fill:var(--muted); }
    .chip { font-size:12px; font-weight:650; }

    .m-lens { fill:var(--accent-bg); stroke:var(--ink); stroke-width:9; }
    .m-handle { stroke:var(--ink); stroke-width:15; stroke-linecap:round; }
    .m-curve { fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .m-base { stroke:var(--ink); stroke-width:3; opacity:.45; }
    .m-tail { fill:var(--accent); opacity:.9; }
    .m-alpha { stroke:var(--accent); stroke-width:3; stroke-dasharray:5 4; }

    .word { font-size:64px; font-weight:700; letter-spacing:-1.5px; }
    .tag { fill:var(--muted); font-size:24px; }
    .panel { fill:var(--box); stroke:var(--edge); }
    .sigzone { fill:var(--bad-bg); opacity:.75; }
    .alpha { stroke:var(--ink); stroke-width:1.4; stroke-dasharray:4 3; }
    .alphat { font-size:11.5px; font-weight:600; }
    .rowl { font-size:12.5px; }
    .guide { stroke:var(--edge); stroke-width:1; }
    .pdot-bad { fill:var(--bad); }
    .pdot-ok { fill:var(--bg); stroke:var(--ink); stroke-width:2; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="239" rx="14"/>
  <g transform="translate(52 52) scale(1.0)" class="">
    <defs><clipPath id="lensclip52"><circle cx="62" cy="62" r="45"/></clipPath></defs>
    <line class="m-handle" x1="98" y1="98" x2="128" y2="128"/>
    <circle class="m-lens" cx="62" cy="62" r="50"/>
    <g clip-path="url(#lensclip52)">
      <path class="m-tail" d="M78.0 66.1 L80.3 69.5 L82.6 72.4 L84.9 75.0 L87.1 77.1 L89.4 78.8 L91.7 80.2 L94.0 81.3 L96.3 82.1 L98.6 82.7 L100.9 83.1 L103.1 83.4 L105.4 83.6 L107.7 83.8 L110.0 83.8 L110.0 84.0 L78.0 84.0 z"/>
      <line class="m-base" x1="10" y1="84" x2="114" y2="84"/>
      <path class="m-curve" d="M14.0 82.5 L16.7 81.8 L19.3 80.7 L22.0 79.2 L24.7 77.2 L27.3 74.8 L30.0 71.7 L32.7 68.1 L35.3 64.0 L38.0 59.6 L40.7 54.9 L43.3 50.4 L46.0 46.2 L48.7 42.6 L51.3 39.9 L54.0 38.4 L56.7 38.0 L59.3 39.0 L62.0 41.1 L64.7 44.3 L67.3 48.2 L70.0 52.6 L72.7 57.3 L75.3 61.8 L78.0 66.1 L80.7 70.0 L83.3 73.3 L86.0 76.1 L88.7 78.3 L91.3 80.0 L94.0 81.3 L96.7 82.2 L99.3 82.8 L102.0 83.3 L104.7 83.5 L107.3 83.7 L110.0 83.8"/>
      <line class="m-alpha" x1="78" y1="30" x2="78" y2="92"/>
    </g>
  </g>
  <text class="word" x="212" y="122">stataudit</text>
  <text class="tag" x="215" y="164">Does the conclusion survive?</text>
  <g><rect class="panel" x="600" y="34" width="334" height="172" rx="10"/><rect class="sigzone" x="718" y="46" width="141.1" height="122" rx="3"/><text class="small" x="788.6" y="60" text-anchor="middle">p &lt; α</text><line class="alpha" x1="859.1" y1="46" x2="859.1" y2="168"/><text class="alphat" x="864.1" y="60">α = .05</text><text class="rowl" x="614" y="86.5">Student's t</text><line class="guide" x1="718" y1="82" x2="918" y2="82"/><circle class="pdot-bad" cx="730.4" cy="82" r="4.6"/><text class="rowl" x="614" y="111.5">Welch's t</text><line class="guide" x1="718" y1="107" x2="918" y2="107"/><circle class="pdot-ok" cx="866.0" cy="107" r="4.6"/><text class="rowl" x="614" y="136.5">Mann-Whitney</text><line class="guide" x1="718" y1="132" x2="918" y2="132"/><circle class="pdot-ok" cx="868.6" cy="132" r="4.6"/><text class="rowl" x="614" y="161.5">Yuen trimmed</text><line class="guide" x1="718" y1="157" x2="918" y2="157"/><circle class="pdot-ok" cx="908.2" cy="157" r="4.6"/><text class="small" x="614" y="190">same data, four analyses</text><rect class="c-bad" x="822" y="175" width="98" height="22" rx="11.0"/><text class="chip t-bad" x="871.0" y="190.3" text-anchor="middle">does not hold</text></g>
</svg>

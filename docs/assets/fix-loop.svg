<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">stataudit fix: propose, gate, verify</title>
  <desc id="d">The experimental fix agent. The model sees the script as text, the audit findings and a data summary (n, missing values, mean, standard deviation and CSV columns; raw values only with --share-data). It proposes a patch through read-only tools and a schema-checked submit; this step holds the API key and runs nothing. A static gate rejects patches that do not parse or that import os, subprocess, socket, shutil, ctypes or importlib, or use eval, exec, __import__ or open for writing. stataudit then runs the patched script through the tracer in a subprocess with a timeout and no secrets, and accepts it only if the same questions are answered, the tests hold or improve, and no new critical findings appear. A verified fix is shown as a diff with before and after verdicts and is written only with --apply or --out; otherwise the findings are fed back for up to two rounds, and if nothing verifies the plain audit report stands.</desc>
  <style>
    svg { --bg:#ffffff; --edge:#d5dae1; --ink:#1b1f24; --muted:#5b6470; --box:#f5f7f9; --arrow:#8a93a0;
          --accent:#3557c4; --accent-bg:#e9eefc; --ok:#1a7f37; --ok-bg:#e3f4e8; --warn:#9a6700; --warn-bg:#fff3d1;
          --bad:#c62828; --bad-bg:#fde9e7; --grey-bg:#eceff3; --dot:#4b5563; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#12161c; --edge:#343c47; --ink:#e9edf1; --muted:#9aa4ae; --box:#1a2029; --arrow:#6f7884;
            --accent:#8fa8ff; --accent-bg:#1d2648; --ok:#57c27a; --ok-bg:#15301f; --warn:#e0b04a; --warn-bg:#362b12;
            --bad:#ff7b72; --bad-bg:#3a1a1a; --grey-bg:#242b35; --dot:#aeb6c0; }
    }
    text { font-family:-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill:var(--ink); }
    .mono { font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill:var(--bg); stroke:var(--edge); }
    .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
    .inner { fill:var(--bg); stroke:var(--edge); }
    .h { font-size:15px; font-weight:650; }
    .h2 { font-size:13.5px; font-weight:600; }
    .sub { font-size:12.5px; fill:var(--muted); }
    .small { font-size:11.5px; fill:var(--muted); }
    .wire { fill:none; stroke:var(--arrow); stroke-width:1.6; }
    .head { fill:var(--arrow); }
    .pill { fill:var(--bg); stroke:var(--edge); }
    .num { fill:var(--accent); font-size:12px; font-weight:700; }
    .numc { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.2; }
    .c-ok { fill:var(--ok-bg); } .t-ok { fill:var(--ok); }
    .c-warn { fill:var(--warn-bg); } .t-warn { fill:var(--warn); }
    .c-bad { fill:var(--bad-bg); } .t-bad { fill:var(--bad); }
    .c-acc { fill:var(--accent-bg); } .t-acc { fill:var(--accent); }
    .c-grey { fill:var(--grey-bg); } .t-grey { fill:var(--muted); }
    .chip { font-size:12px; font-weight:650; }

    .agent { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.4; stroke-dasharray:5 4; }
    .loop { fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:5 4; }
    .vhead { fill:var(--accent); }
    .lpill { fill:var(--bg); stroke:var(--accent); }
    .lpt { font-size:11.5px; fill:var(--accent); font-weight:600; }
    .keypill { fill:var(--bg); stroke:var(--accent); stroke-width:1.2; }
    .nopill { fill:var(--bg); stroke:var(--edge); stroke-width:1.2; }
    .ckbox { fill:var(--ok-bg); stroke:var(--ok); stroke-width:1.2; }
    .ck { fill:none; stroke:var(--ok); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .okbox { fill:var(--ok-bg); stroke:var(--ok); stroke-width:1.2; }
    .warnbox { fill:var(--warn-bg); stroke:var(--warn); stroke-width:1.2; }
    .okh { fill:var(--ok); font-size:14px; font-weight:700; }
    .warnh { fill:var(--warn); font-size:14px; font-weight:700; }
    .okl { font-size:12px; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="varr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="vhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="379" rx="14"/>

  <polyline class="loop" points="676,62 676,30 306,30 306,58" marker-end="url(#varr)"/>
  <rect class="lpill" x="351.0" y="19" width="280" height="22" rx="11"/>
  <text class="lpt" x="491.0" y="34" text-anchor="middle">not verified: findings fed back (--rounds 2)</text>
  <rect class="box" x="20" y="62" width="176" height="230" rx="10"/>
  <text class="h" x="34" y="89">What the model sees</text>
  <rect class="inner" x="32" y="104" width="152" height="44" rx="7"/>
  <text class="h2 mono" x="44" y="123" font-size="12.5">analysis.py</text>
  <text class="small" x="44" y="139">the script, as text</text>
  <rect class="inner" x="32" y="156" width="152" height="44" rx="7"/>
  <text class="h2 mono" x="44" y="175" font-size="12.5">findings.json</text>
  <text class="small" x="44" y="191">the audit result</text>
  <rect class="inner" x="32" y="208" width="152" height="44" rx="7"/>
  <text class="h2 mono" x="44" y="227" font-size="12.5">data summaries</text>
  <text class="small" x="44" y="243">n, mean, sd; CSV columns</text>
  <text class="small" x="34" y="274">raw values: --share-data</text>
  <rect class="agent" x="220" y="62" width="168" height="230" rx="10"/>
  <circle class="numc" cx="244" cy="84" r="11"/><text class="num" x="244" y="88.2" text-anchor="middle">1</text>
  <text class="h" x="262" y="89">Propose</text>
  <text class="sub" x="236" y="120">An LLM reads the</text>
  <text class="sub" x="236" y="140">inputs with read-only</text>
  <text class="sub" x="236" y="160">tools. Its only output</text>
  <text class="sub" x="236" y="180">is a schema-checked</text>
  <text class="sub" x="236" y="200">patch.</text>
  <rect class="keypill" x="234" y="224" width="140" height="24" rx="12"/>
  <text class="chip t-acc" x="304.0" y="240.3" text-anchor="middle">holds the API key</text>
  <rect class="nopill" x="234" y="256" width="140" height="24" rx="12"/>
  <text class="chip t-grey" x="304.0" y="272.3" text-anchor="middle">runs nothing</text>
  <rect class="box" x="412" y="62" width="180" height="230" rx="10"/>
  <circle class="numc" cx="436" cy="84" r="11"/><text class="num" x="436" y="88.2" text-anchor="middle">2</text>
  <text class="h" x="454" y="89">Static gate</text>
  <text class="sub" x="428" y="120">must parse; rejects</text>
  <text class="small mono" font-size="11" x="428" y="146">import os, subprocess,</text>
  <text class="small mono" font-size="11" x="428" y="166">socket, shutil, ctypes,</text>
  <text class="small mono" font-size="11" x="428" y="186">importlib</text>
  <text class="small mono" font-size="11" x="428" y="206">eval, exec, __import__</text>
  <text class="small mono" font-size="11" x="428" y="226">open() for writing</text>
  <rect class="box" x="616" y="62" width="200" height="230" rx="10"/>
  <circle class="numc" cx="640" cy="84" r="11"/><text class="num" x="640" y="88.2" text-anchor="middle">3</text>
  <text class="h" x="658" y="89">Verify by running</text>
  <text class="sub" x="632" y="120">the patched script, traced,</text>
  <text class="sub" x="632" y="140">in a subprocess with a</text>
  <text class="sub" x="632" y="160">timeout and no secrets</text>
  <rect class="ckbox" x="632" y="189" width="14" height="14" rx="3"/>
  <polyline class="ck" points="635,196 638,199 643,193"/>
  <text class="sub" x="654" y="200">same questions answered</text>
  <rect class="ckbox" x="632" y="217" width="14" height="14" rx="3"/>
  <polyline class="ck" points="635,224 638,227 643,221"/>
  <text class="sub" x="654" y="228">tests hold or improve</text>
  <rect class="ckbox" x="632" y="245" width="14" height="14" rx="3"/>
  <polyline class="ck" points="635,252 638,255 643,249"/>
  <text class="sub" x="654" y="256">no new critical findings</text>
  <rect class="okbox" x="842" y="62" width="138" height="106" rx="10"/>
  <text class="okh" x="856" y="87">verified fix</text>
  <text class="okl" x="856" y="110">diff + before/after</text>
  <text class="okl" x="856" y="128">verdicts; written</text>
  <text class="okl" x="856" y="146">with --apply or --out</text>
  <rect class="warnbox" x="842" y="186" width="138" height="106" rx="10"/>
  <text class="warnh" x="856" y="211">no fix</text>
  <text class="okl" x="856" y="234">the plain audit</text>
  <text class="okl" x="856" y="252">report stands</text>
  <path class="wire" d="M196 177.0 L218 177.0" marker-end="url(#arr)"/>
  <path class="wire" d="M388 177.0 L410 177.0" marker-end="url(#arr)"/>
  <path class="wire" d="M592 177.0 L614 177.0" marker-end="url(#arr)"/>
  <path class="wire" d="M816 177.0 C 832 177.0, 828 115, 840 115" marker-end="url(#arr)"/>
  <path class="wire" d="M816 177.0 C 832 177.0, 828 239, 840 239" marker-end="url(#arr)"/>
  <text class="sub" x="20" y="332">The model proposes; stataudit decides by executing. An LLM never sets a verdict, and nothing it writes runs in the process that holds the key.</text>
  <text class="small" x="20" y="352">stataudit explain works the same way for prose: every number in the model's summary must appear in the findings, or the deterministic summary is used.</text>
</svg>

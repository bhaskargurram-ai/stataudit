<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" role="img" aria-labelledby="t d">
  <title id="t">Does the conclusion survive? Example 01, measured</title>
  <desc id="d">Left: the data from examples/01_ttest_outliers.py as dot plots. Control has 60 values between 8 and 15 minutes with mean 11.7. Treated has 14 values: 11 between 10 and 14, plus 3 users who left the tab open at 21.5, 24 and 26.5 minutes, which pull its mean from 12.0 to 14.6; the variances differ 16 times. Right: the p-value of four analyses on a log scale with alpha = 0.05. Student's t-test, which the script ran, gives p = 0.0003. Welch's t gives 0.066, Mann-Whitney U 0.073 and Yuen's trimmed t 0.342, all above alpha. Verdict: does not hold.</desc>
  <style>
    svg { --bg:#ffffff; --edge:#d5dae1; --ink:#1b1f24; --muted:#5b6470; --box:#f5f7f9; --arrow:#8a93a0;
          --accent:#3557c4; --accent-bg:#e9eefc; --ok:#1a7f37; --ok-bg:#e3f4e8; --warn:#9a6700; --warn-bg:#fff3d1;
          --bad:#c62828; --bad-bg:#fde9e7; --grey-bg:#eceff3; --dot:#4b5563; }
    @media (prefers-color-scheme: dark) {

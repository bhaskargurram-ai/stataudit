[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stataudit"
version = "1.0.0"
description = "Check AI-written statistics with evidence: re-run the analysis, audit each test's assumptions on the real data, recompute reported p-values, lint analysis code, and verify proposed fixes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com" }]
requires-python = ">=3.10"
keywords = ["statistics", "audit", "assumptions", "hypothesis-testing", "scipy", "reproducibility", "p-hacking",
            "statcheck", "jupyter", "github-actions", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=1.5",
    "click>=8.0",
    "jinja2>=3.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["flask>=2.2"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7", "flask>=2.2", "mcp>=1.2", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/bhaskargurram-ai/stataudit"
Documentation = "https://github.com/bhaskargurram-ai/stataudit#readme"
Changelog = "https://github.com/bhaskargurram-ai/stataudit/blob/main/CHANGELOG.md"
Issues = "https://github.com/bhaskargurram-ai/stataudit/issues"

[project.scripts]
stataudit = "stataudit.cli:main"
stataudit-mcp = "stataudit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stataudit = ["reports/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
